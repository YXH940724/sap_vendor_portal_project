server:
  port: ${PORT:3000}
spring:
  application:
    name: sap-vendor-portal
  jackson:
    default-property-inclusion: non_null
portal:
  auth-mode: ${PORTAL_AUTH_MODE:single_vendor}
  vendor-id: ${PORTAL_VENDOR_ID:}
  identity-hmac-secret: ${PORTAL_IDENTITY_HMAC_SECRET:}
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  sap:
    auth-mode: ${SAP_AUTH_MODE:basic}
    username: ${SAP_USERNAME:}
    password: ${SAP_PASSWORD:}
    bearer-token: ${SAP_BEARER_TOKEN:}
    business-partner:
      url: ${SAP_BUSINESS_PARTNER_URL:https://my200127-api.s4hana.sapcloud.cn/sap/opu/odata/sap/API_BUSINESS_PARTNER}
      entity: A_BusinessPartner
      supplier-field: BusinessPartner
    purchase-order:
      url: ${SAP_PURCHASE_ORDER_URL:https://my200127-api.s4hana.sapcloud.cn/sap/opu/odata4/sap/api_purchaseorder_2/srvd_a2x/sap/purchaseorder/0001/}
      entity: PurchaseOrder
      supplier-field: Supplier
      expand: _PurchaseOrderItem
    asn:
      url: ${SAP_ASN_URL:https://my200127-api.s4hana.sapcloud.cn/sap/opu/odata/sap/API_INBOUND_DELIVERY_SRV;v=0002}
      entity: A_InbDeliveryHeader
      supplier-field: Supplier
      expand: to_DeliveryDocumentItem
    # 仅当租户的 $metadata 确认 ASN 写入实体不同于标准实体时才配置；留空时使用 asn.entity。
    asn-create-path: ${SAP_ASN_CREATE_PATH:}
    asn-create-vendor-field: ${SAP_ASN_CREATE_VENDOR_FIELD:}
    material-document:
      url: ${SAP_MATERIAL_DOCUMENT_URL:https://my200127-api.s4hana.sapcloud.cn/sap/opu/odata/sap/API_MATERIAL_DOCUMENT_SRV}
      entity: A_MaterialDocumentItem
      supplier-field: Supplier
      scope-mode: purchase_order
      reference-field: PurchaseOrder
      expand: to_MaterialDocumentHeader
    supplier-invoice:
      url: ${SAP_SUPPLIER_INVOICE_URL:https://my200127-api.s4hana.sapcloud.cn/sap/opu/odata/sap/API_SUPPLIERINVOICE_PROCESS_SRV}
      entity: A_SupplierInvoice
      supplier-field: InvoicingParty
      expand: to_SuplrInvcItemPurOrdRef
