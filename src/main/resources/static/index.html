<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAP 供应商协同控制台" />
    <title>SAP 供应商协同控制台</title>
    <link rel="stylesheet" href="/styles-v4.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/dashboard" aria-label="供应商协同控制台首页"><span class="brand-logo">▱</span><span><b>供应商协同控制台</b><small>SAP Supplier Portal</small></span></a>
        <nav class="sidebar-nav" aria-label="主导航">
          <div class="nav-group"><p>概览</p><button class="nav-item" data-route="dashboard"><i>▦</i>工作台</button><button class="nav-item" data-route="analytics"><i>▥</i>数据看板</button></div>
          <div class="nav-group"><p>业务协同</p><button class="nav-item" data-route="purchaseOrders"><i>▤</i>采购订单</button><button class="nav-item" data-route="asns"><i>↗</i>ASN / 发运</button><button class="nav-item" data-route="materialDocuments"><i>▣</i>收货凭证</button><button class="nav-item" data-route="invoices"><i>▭</i>结算对账</button></div>
          <div class="nav-group"><p>基础数据</p><button class="nav-item" data-route="suppliers"><i>♧</i>供应商资料</button></div>
        </nav>
        <div class="sidebar-footer"><span class="live-dot"></span><span>SAP 实时数据 · <b id="connectionLabel">检查中</b></span><small>v2.0 · S/4HANA</small></div>
      </aside>
      <main class="main-panel">
        <header class="topbar"><button id="menuButton" class="menu-button" aria-label="展开导航">☰</button><div class="breadcrumb"><span>⌂</span><em>/</em><span id="vendorName">供应商工作空间</span><em>/</em><b id="breadcrumbPage">工作台</b></div><div class="topbar-actions"><span class="update-time">◷ 数据更新于 <b id="updateTime">刚刚</b></span><button id="refreshButton" class="btn btn-ghost">↻ 刷新数据</button><div class="user-chip"><span>供</span><p><b>供应商用户</b><small id="vendorScope">身份校验中</small></p></div></div></header>
        <section id="pageContainer" class="page-container" aria-live="polite"></section>
      </main>
    </div>
    <div id="drawerOverlay" class="drawer-overlay"></div><aside id="drawer" class="drawer"><header><div><small>DOCUMENT DETAIL</small><h2 id="drawerTitle">单据详情</h2></div><button id="closeDrawer" aria-label="关闭详情">×</button></header><div id="drawerBody"></div></aside>
    <div id="modalOverlay" class="modal-overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><div><small>CREATE ASN</small><h2 id="modalTitle">基于订单创建 ASN</h2></div><button id="closeModal" aria-label="关闭">×</button></header><form id="asnForm"><p>请按实际发运计划填写。供应商范围将由服务端强制校验。</p><div class="form-grid"><label>采购订单<input name="purchaseOrder" required placeholder="4500001234" /></label><label>实际发运日期<input name="shippingDate" required type="date" /></label><label>计划到货日期<input name="plannedDeliveryDate" required type="date" /></label><label>运输单号<input name="transportReference" placeholder="可选" /></label></div><div class="form-lines"><div><b>发运行项目</b><button type="button" id="addAsnLine" class="link-button">＋ 添加行</button></div><div id="asnLines"></div></div><footer><span id="asnMessage"></span><button type="button" id="cancelModal" class="btn btn-secondary">取消</button><button class="btn btn-primary" type="submit">提交 ASN</button></footer></form></section></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
